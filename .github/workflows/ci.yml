name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One run per branch/PR: a newer push cancels the older run (never on main or tags, so a
# release run is not cut off).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.experimental && ' (experimental)' || '' }}
    runs-on: ubuntu-latest
    # PHP 8.6 (GA 2026-11-19) runs as setup-php's "nightly" build until the action lists it as
    # stable: its result is shown but does not fail the run (decision E10, PHP-1).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Only supported versions: the minimum ("Requires PHP") and newer (decision E10).
        php: ["8.5"]
        experimental: [false]
        include:
          - php: "8.6"
            experimental: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, dom, mbstring
          coverage: none
      - name: Lint
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: php tests/run.php
      - name: Connector starter test
        run: php examples/connector-addon/tests/connector-test.php

  integration:
    name: Integration (${{ matrix.db }}, PHP ${{ matrix.php }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # The minimum database servers (MySQL 9.7 LTS, MariaDB 12.3 LTS) on the minimum PHP
        # version (decision E10); deprecations in src/ fail the run (tests/integration/bootstrap.php).
        # PHP 8.6 as nightly build: shown, but does not fail the run.
        include:
          - db: "MariaDB 12.3"
            image: mariadb:12.3
            health: healthcheck.sh --connect --innodb_initialized
            php: "8.5"
            experimental: false
          - db: "MySQL 9.7"
            image: mysql:9.7
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
            php: "8.5"
            experimental: false
          - db: "MariaDB 12.3"
            image: mariadb:12.3
            health: healthcheck.sh --connect --innodb_initialized
            php: "8.6"
            experimental: true
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_DATABASE: wpac_test
          MARIADB_USER: wpac
          MARIADB_PASSWORD: wpac
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: wpac_test
          MYSQL_USER: wpac
          MYSQL_PASSWORD: wpac
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="${{ matrix.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium, dom, mbstring
          coverage: none
      - name: Ledger and payout integration tests
        env:
          WPAC_TEST_DB_HOST: 127.0.0.1
        run: php tests/integration/run.php

  # MySQL with lower_case_table_names=1 (Windows, some managed hosts): table names come back in
  # lower case; a mixed-case prefix shows whether the plugin still finds its tables.
  integration-lower-case:
    name: Integration (MySQL 9.7, lower_case_table_names=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring
          coverage: none
      - name: MySQL with lower_case_table_names=1
        run: |
          docker run -d --name lcdb -p 3307:3306 -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=wpac_test -e MYSQL_USER=wpac -e MYSQL_PASSWORD=wpac mysql:9.7 --lower-case-table-names=1
          for i in $(seq 1 60); do docker exec lcdb mysqladmin ping -uroot -proot --silent && break; sleep 2; done
          sleep 5
          docker exec lcdb mysql -uroot -proot -N -e "SELECT @@lower_case_table_names"
      - name: Integration tests with prefix Wp_
        env:
          WPAC_TEST_DB_HOST: 127.0.0.1:3307
          WPAC_TEST_DB_PREFIX: Wp_
        run: php tests/integration/run.php

  coverage:
    name: Coverage (unit + integration)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wpac_test
          MARIADB_USER: wpac
          MARIADB_PASSWORD: wpac
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring
          coverage: xdebug
      - name: Tests with line coverage
        env:
          WPAC_TEST_DB_HOST: 127.0.0.1
          # Fails below this total line coverage (tests/coverage-report.php; measured 73 %).
          WPAC_COVERAGE_MIN: "70"
        run: |
          # Without pipefail the exit code of "| tee" would hide a failing coverage check.
          set -o pipefail
          php -d xdebug.mode=coverage -d auto_prepend_file=tests/coverage-prepend.php tests/run.php
          php -d xdebug.mode=coverage -d auto_prepend_file=tests/coverage-prepend.php tests/integration/run.php
          php tests/coverage-report.php | tee coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/

  static:
    name: Static analysis (PHPCS/WPCS, PHPCompatibility, PHPStan, composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none
      - name: Install analysis tools
        # From the committed composer.lock (exact versions pinned to commits); refresh it with
        # "composer update" and commit the result (R13-N13).
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Composer validate and dependency audit
        run: |
          composer validate --strict
          composer audit --no-interaction --locked
      - name: PHPCS (WordPress security sniffs + PHPCompatibilityWP)
        run: vendor/bin/phpcs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # Electronic invoices (src/Payouts/EInvoice.php) checked with the official KoSIT validator and
  # the XRechnung validator configuration (pinned versions, SHA-256 checked in validate.sh):
  # samples of every document kind and VAT category, EN 16931 core profile (scenario
  # "EN16931 (CII)": CII D16B schema + EN 16931 CII schematron) and XRechnung 3.0 (scenario
  # "EN16931 XRechnung (CII)": additionally the XRechnung CII schematron). Any error-level
  # finding, a rejected document or an unexpected scenario fails the job.
  einvoice:
    name: E-invoice (KoSIT validator)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wpac_test
          MARIADB_USER: wpac
          MARIADB_PASSWORD: wpac
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring
          coverage: none
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate sample e-invoices
        env:
          WPAC_TEST_DB_HOST: 127.0.0.1
        run: php tests/einvoice/generate.php "$RUNNER_TEMP/einvoice/samples"
      - name: Validate with the KoSIT validator
        run: tests/einvoice/validate.sh "$RUNNER_TEMP/einvoice/samples" "$RUNNER_TEMP/einvoice/work"
      - name: Copy samples and reports
        if: always()
        run: |
          mkdir -p einvoice-artifacts
          cp -r "$RUNNER_TEMP/einvoice/samples" einvoice-artifacts/ 2>/dev/null || true
          cp -r "$RUNNER_TEMP/einvoice/work/reports" einvoice-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: einvoice-kosit
          path: einvoice-artifacts/

  qr-decode:
    name: QR decode + translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zbar-tools && pip install pillow
      - run: python3 tests/qr_decode_check.py
      - name: German translation complete and up to date
        run: |
          missing=$(python3 bin/i18n.py missing de_DE)
          if [ -n "$missing" ]; then echo "Untranslated strings:"; echo "$missing"; exit 1; fi
          python3 bin/i18n.py pot && python3 bin/i18n.py build de_DE
          git diff --exit-code -- languages/*.po languages/*.pot || (echo "Run: python3 bin/i18n.py pot && python3 bin/i18n.py build de_DE" && exit 1)

  e2e:
    name: Browser tests (WordPress + WooCommerce, object cache ${{ matrix.cache }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: [none, redis]
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wpac_e2e
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hastla007/wp-couponmaster
          path: siblings/wp-couponmaster
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hastla007/wp-passmaster
          path: siblings/wp-passmaster
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring, gd, zip, redis
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Test site (WordPress, WooCommerce, all three plugins)
        run: |
          tests/ci/install-wp.sh "$RUNNER_TEMP/wp" --siblings "$GITHUB_WORKSPACE/siblings" > "$RUNNER_TEMP/site.env"
          cat "$RUNNER_TEMP/site.env"
          grep -E '^(PRODUCT_ID|PARTNER_CODE)=[A-Za-z0-9-]+$' "$RUNNER_TEMP/site.env" >> "$GITHUB_ENV"
      - name: Redis object cache
        if: matrix.cache == 'redis'
        run: |
          curl -fsSL -o /tmp/redis-cache.zip https://downloads.wordpress.org/plugin/redis-cache.latest-stable.zip
          unzip -q /tmp/redis-cache.zip -d "$RUNNER_TEMP/wp/wp-content/plugins"
          php tests/ci/verify-plugin.php "$RUNNER_TEMP/wp/wp-content/plugins/redis-cache" redis-cache
          cp "$RUNNER_TEMP/wp/wp-content/plugins/redis-cache/includes/object-cache.php" "$RUNNER_TEMP/wp/wp-content/object-cache.php"
          sed -i "s#^define( 'DB_NAME'#define( 'WP_REDIS_HOST', '127.0.0.1' );\ndefine( 'DB_NAME'#" "$RUNNER_TEMP/wp/wp-config.php"
          php -r '$_SERVER["HTTP_HOST"]="127.0.0.1:8088"; require getenv("RUNNER_TEMP")."/wp/wp-load.php"; if ( ! wp_using_ext_object_cache() ) { fwrite( STDERR, "object cache not active\n" ); exit( 1 ); } echo "external object cache active\n";'
      - name: Web server
        run: (cd "$RUNNER_TEMP/wp" && PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8088 -t . "$GITHUB_WORKSPACE/tests/ci/router.php" > "$RUNNER_TEMP/server.log" 2>&1 &) && sleep 2
      - name: Browser tests
        working-directory: tests/e2e
        env:
          WP_URL: http://127.0.0.1:8088
          ADMIN_USER: admin
          ADMIN_PASS: admin-pass-123
          PARTNER_USER: perf2
          PARTNER_PASS: perf2-pass-123
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node run.js
      - name: Cross-plugin test (Voucher Captain, Pass Captain, WooCommerce)
        run: php tests/cross-plugin/run.php "$RUNNER_TEMP/wp" 127.0.0.1:8088
      - name: Smoke test (orders, REST, all admin pages, PHP log)
        run: php tests/ci/smoke.php "$RUNNER_TEMP/wp" http://127.0.0.1:8088
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/server.log" || true
          tail -n 100 "$RUNNER_TEMP/wp/wp-content/debug.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-artifacts-${{ matrix.cache }}
          path: tests/e2e/artifacts

  # The oldest versions the plugin declares ("Requires at least", "Requires PHP",
  # "WC requires at least"): activation, schema, a WooCommerce order and refund, front end,
  # REST and every admin page. The Blocks-checkout field needs WooCommerce 8.9 and is covered by
  # the browser job with the latest versions.
  minimum-versions:
    name: Minimum versions (WordPress 6.3, WooCommerce 8.0, MariaDB 12.3, PHP 8.5)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wpac_e2e
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring, gd, zip
          coverage: none
      - name: Test site with the minimum versions
        env:
          WP_VERSION: "6.3"
          WC_VERSION: "8.0.0"
        run: tests/ci/install-wp.sh "$RUNNER_TEMP/wp"
      - name: Web server
        run: (cd "$RUNNER_TEMP/wp" && PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8088 -t . "$GITHUB_WORKSPACE/tests/ci/router.php" > "$RUNNER_TEMP/server.log" 2>&1 &) && sleep 2
      - name: Smoke test
        run: php tests/ci/smoke.php "$RUNNER_TEMP/wp" http://127.0.0.1:8088
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/server.log" || true
          tail -n 100 "$RUNNER_TEMP/wp/wp-content/debug.log" || true

  # Newest stable PHP with the current WordPress and WooCommerce (R14-A4): the smoke test fails on
  # deprecations and notices from the plugin in debug.log.
  latest-php:
    name: Smoke test (current WordPress and WooCommerce, PHP 8.5)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wpac_e2e
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring, gd, zip
          coverage: none
      - name: Test site (current WordPress and WooCommerce)
        run: tests/ci/install-wp.sh "$RUNNER_TEMP/wp"
      - name: Web server
        run: (cd "$RUNNER_TEMP/wp" && PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8088 -t . "$GITHUB_WORKSPACE/tests/ci/router.php" > "$RUNNER_TEMP/server.log" 2>&1 &) && sleep 2
      - name: Smoke test
        run: php tests/ci/smoke.php "$RUNNER_TEMP/wp" http://127.0.0.1:8088
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/server.log" || true
          tail -n 100 "$RUNNER_TEMP/wp/wp-content/debug.log" || true

  # Official Plugin Check (the WordPress.org review tool) on the built ZIP. Errors fail the job,
  # except documented false positives in tests/ci/plugin-check-ignore.txt; warnings are listed.
  plugin-check:
    name: Plugin Check (WordPress.org)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wpac_pcp
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring, zip
          tools: wp-cli
          coverage: none
      - name: Build ZIP
        run: bin/build-zip.sh
      - name: WordPress with Plugin Check and the built plugin
        run: |
          wp core download --path="$RUNNER_TEMP/wp"
          wp config create --path="$RUNNER_TEMP/wp" --dbname=wpac_pcp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path="$RUNNER_TEMP/wp" --url=http://127.0.0.1:8090 --title=PCP --admin_user=admin --admin_password=admin-pass-123 --admin_email=admin@example.test --skip-email
          unzip -q dist/affiliate-captain-*.zip -d "$RUNNER_TEMP/wp/wp-content/plugins"
          wp plugin install plugin-check --activate --path="$RUNNER_TEMP/wp"
          wp plugin activate affiliate-captain --path="$RUNNER_TEMP/wp"
      - name: Plugin Check
        run: |
          # Without pipefail the exit code of "| tee" would hide the result of the evaluation
          # (the job – and with it the release – could never fail).
          set -o pipefail
          wp plugin check affiliate-captain --format=json --path="$RUNNER_TEMP/wp" > "$RUNNER_TEMP/plugin-check.json"
          php tests/ci/plugin-check.php "$RUNNER_TEMP/plugin-check.json" | tee -a "$GITHUB_STEP_SUMMARY"

  multisite:
    name: Multisite (network activation, new and deleted sites)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wpac_e2e
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring, gd, zip
          coverage: none
      - name: Network test
        env:
          WP_URL: http://example.test
        run: |
          tests/ci/install-wp.sh "$RUNNER_TEMP/wp"
          tests/ci/multisite.sh "$RUNNER_TEMP/wp"

  upgrade:
    name: Upgrade from ${{ matrix.from }} (real dbDelta)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "previous": the newest final release; v0.10.0: the last release in the old folder
        # "wp-affiliate-captain" (takeover by the new copy, uninstalling the old one keeps the data).
        # Both declare PHP 7.4 and also run on PHP 8.5 (their integration suites pass on 8.5,
        # checked 2026-11-16), so the old release is installed and upgraded on PHP 8.5.
        from: [previous, v0.10.0]
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wpac_e2e
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: mysqli, sodium, dom, mbstring, gd, zip
          coverage: none
      - name: Install the previous release with test data
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          FROM: ${{ matrix.from }}
        run: |
          if [ "$FROM" = "previous" ]; then
            # The newest final release (vX.Y.Z, no -rc/-beta) other than the tag of this run: on
            # a tag push the newest tag is the one being built, which would test X.Y.Z -> X.Y.Z.
            current=""
            if [ "$REF_TYPE" = "tag" ]; then current="$REF_NAME"; fi
            last="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "${current:-none}" | head -n 1)"
          else
            last="$(git tag --list "$FROM" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
            git cat-file -e "$last:wp-affiliate-captain.php" || { echo "$FROM is not a release in the old folder"; exit 1; }
          fi
          [ -n "$last" ] || { echo "No previous release tag found"; exit 1; }
          echo "Previous release: $last"
          git worktree add "$RUNNER_TEMP/old" "$last"
          WPAC_PLUGIN_SRC="$RUNNER_TEMP/old" tests/ci/install-wp.sh "$RUNNER_TEMP/wp"
          php tests/ci/upgrade-check.php "$RUNNER_TEMP/wp" 127.0.0.1:8088 "$RUNNER_TEMP/before.json"
      - name: Switch to this version and migrate
        env:
          # The takeover run must really take over the old copy (switch-plugin.php fails otherwise).
          WPAC_EXPECT_TAKEOVER: ${{ matrix.from == 'v0.10.0' && '1' || '' }}
        run: |
          # Up to 0.10 the plugin folder was "wp-affiliate-captain"; the new copy is installed
          # next to it and takes over (the old copy is deactivated, data stays).
          ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/wp/wp-content/plugins/affiliate-captain"
          php tests/ci/switch-plugin.php "$RUNNER_TEMP/wp" 127.0.0.1:8088
          php tests/ci/upgrade-check.php "$RUNNER_TEMP/wp" 127.0.0.1:8088 "$RUNNER_TEMP/before.json"

  release:
    name: Release ZIP
    needs: [test, integration, integration-lower-case, qr-decode, e2e, static, coverage, multisite, upgrade, minimum-versions, latest-php, plugin-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          coverage: none
      # Ref names are never interpolated into the script (shell injection via tag names):
      # they are passed as environment variables and validated against a strict version pattern.
      - name: Build ZIP
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected=""
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
              echo "Refusing tag name that is not a version: $REF_NAME"; exit 1
            fi
            expected="$REF_NAME"
          fi
          bin/build-zip.sh "$expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affiliate-captain
          path: dist/*.zip

  # Only this job gets write access, and only for tags and main (never for branches or PRs).
  publish:
    name: GitHub release
    needs: [release]
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Release on a pushed tag v*, or on a push to main for v<plugin version>
      # when that release does not exist yet (the tag is then created on this commit).
      - name: Determine release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_re='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'
          tag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Only commits that are in main are released: a v* tag on an unmerged branch builds
            # and tests, but publishes nothing.
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              tag="$GITHUB_REF_NAME"
            else
              echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not in main - no release."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            v="$(sed -n 's/^ \* Version: *\([0-9A-Za-z.\-]*\).*/\1/p' affiliate-captain.php)"
            if gh release view "v$v" >/dev/null 2>&1; then
              echo "Release v$v exists"
            elif git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              # The tag exists without a release (release deleted in a rollback, or a tag pushed
              # early onto another commit): a release now would hang at the old tag commit with
              # the ZIP of this commit. Never reuse a version: raise it (RELEASE.md).
              echo "::error::Tag v$v exists without a release - nothing published. Raise the plugin version."
              exit 1
            else
              tag="v$v"
            fi
          fi
          if [ -n "$tag" ]; then
            printf '%s' "$tag" | grep -Eq "$version_re" || { echo "Refusing release tag that is not a version: $tag"; exit 1; }
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      # Exactly the ZIP that was built and tested in this run (no second build).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.rel.outputs.tag != ''
        with:
          name: affiliate-captain
          path: dist
      - name: GitHub release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          zip="dist/affiliate-captain-${TAG#v}.zip"
          [ -f "$zip" ] || { echo "Tested ZIP $zip not found (version mismatch)"; ls dist; exit 1; }
          (cd dist && sha256sum "$(basename "$zip")" > "$(basename "$zip").sha256")
          cat "$zip.sha256"
          sha="$(cut -d' ' -f1 "$zip.sha256")"
          # Only the "== Changelog ==" section (the Upgrade Notice has the same "= x.y.z =" headings).
          # CR stripped first (as bin/build-zip.sh does): CRLF lines never equal "= x.y.z =".
          notes="$(tr -d '\r' < readme.txt | awk -v v="${TAG#v}" '/^== /{cl=($0 ~ /^== Changelog ==/); on=0; next} cl && $0 == "= " v " =" {on=1; next} on && /^= /{exit} on')"
          printf -v notes '%s\n\nSHA-256 (%s): `%s`' "${notes:-Siehe readme.txt}" "$(basename "$zip")" "$sha"
          # A pre-release version (0.14.0-rc1) is published as pre-release, never as "Latest".
          pre=()
          case "${TAG#v}" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" "$zip" "$zip.sha256" --target "$GITHUB_SHA" --title "Affiliate Captain ${TAG#v}" --notes "$notes" "${pre[@]}"
