name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, dom, mbstring
          coverage: none
      - name: Lint
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: php tests/run.php

  integration:
    name: Integration (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wpac_test
          MARIADB_USER: wpac
          MARIADB_PASSWORD: wpac
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, sodium, dom, mbstring
          coverage: none
      - name: Ledger and payout integration tests
        env:
          WPAC_TEST_DB_HOST: 127.0.0.1
        run: php tests/integration/run.php

  qr-decode:
    name: QR decode + translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zbar-tools && pip install pillow
      - run: python3 tests/qr_decode_check.py
      - name: German translation complete and up to date
        run: |
          missing=$(python3 bin/i18n.py missing de_DE)
          if [ -n "$missing" ]; then echo "Untranslated strings:"; echo "$missing"; exit 1; fi
          python3 bin/i18n.py pot && python3 bin/i18n.py build de_DE
          git diff --exit-code -- languages/*.po languages/*.pot || (echo "Run: python3 bin/i18n.py pot && python3 bin/i18n.py build de_DE" && exit 1)

  release:
    name: Release ZIP
    needs: [test, integration, qr-decode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Build ZIP
        run: bin/build-zip.sh ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wp-affiliate-captain
          path: dist/*.zip
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --generate-notes
