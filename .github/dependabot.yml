# Dependency updates, bundled so they do not crowd the shared Actions queue: one daily run at a
# fixed time, one grouped PR per ecosystem (security updates in their own group), at most two open.
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 2
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 2
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
